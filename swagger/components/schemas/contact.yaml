type: object
required:
  - _id
  - name
  - phoneNamber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNamber:
    description: "Contact's phoneNamber"
    type: string
    example: '+380100000005'
  email:
    description: "Contact's email"
    type: string
    example: 'povalenko@gmail.com'
  isFavourite:
    description: "Contact'sisFavourite"
    type: boolean
    example: false
  contactType:
    description: "Contact's contactType"
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: "Contact's userId"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png